<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Private Club</title><link rel="stylesheet" href="/static/app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body>
<main class="shell"><header><div class="brand"><span class="mark">P</span><div><b>PRIVATE CLUB</b><small>members area · 18+</small></div></div><span class="pill">Verified</span></header>
<section id="gate" class="card"><h2>Проверка доступа</h2><p class="muted">Telegram-сессия проверяется сервером. Каталог доступен только со статусом APPROVED.</p><button onclick="login()">Продолжить</button><div id="msg"></div></section>
<section id="members" hidden><div class="toolbar"><div><span class="eyebrow">DISCOVER</span><h2>Участники</h2></div><button class="secondary compact" onclick="loadCatalog()">Обновить</button></div><div id="cards" class="profilegrid"></div></section>
</main><script>
let token='';
async function login(){const init=window.Telegram?.WebApp?.initData||'';if(!init){msg.innerHTML='<div class="error">Откройте страницу как Telegram Mini App.</div>';return}const fd=new FormData();fd.append('init_data',init);const r=await fetch('/api/v4/auth/telegram',{method:'POST',body:fd});const j=await r.json();if(!r.ok){msg.innerHTML='<div class="error">'+j.detail+'</div>';return}token=j.access_token;if(j.status!=='APPROVED'){msg.innerHTML='<div class="success">Статус: '+j.status+'. Каталог откроется после одобрения.</div>';return}gate.hidden=true;members.hidden=false;loadCatalog()}
async function loadCatalog(){const r=await fetch('/api/v4/catalog',{headers:{Authorization:'Bearer '+token}});const a=await r.json();cards.innerHTML=a.length?a.map(p=>`<article class="profilecard"><div class="photoPlaceholder"><span>${p.alias.slice(0,1).toUpperCase()}</span></div><div class="profilebody"><span class="pill">${p.profile_type}</span><h3>${p.alias}, ${p.age}</h3><p>${p.city}</p><p class="muted">${p.about||'Описание пока не заполнено'}</p><small>Ищет: ${p.looking_for}</small><div class="swipeactions"><button class="secondary">Пропустить</button><button onclick="like(${p.user_id})">Нравится ♥</button></div></div></article>`).join(''):'<div class="card">Подходящих анкет пока нет.</div>'}
async function like(id){const r=await fetch('/api/v4/like/'+id,{method:'POST',headers:{Authorization:'Bearer '+token}});const j=await r.json();if(j.matched)alert('Взаимная симпатия! Контакт открывается только по взаимному согласию.');loadCatalog()}
</script></body></html>
