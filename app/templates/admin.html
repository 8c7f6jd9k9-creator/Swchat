<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Club · Staff</title><link rel="stylesheet" href="/static/app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main class="shell">
<header><div class="brand"><span class="mark">A</span><div><b>MODERATION</b><small>Private Club</small></div></div><span class="pill" id="rolePill">Staff</span></header>

<section id="gate" class="card"><h2>Вход для персонала</h2><p class="muted">Требуется подписанная Telegram-сессия (Mini App), Telegram ID из allowlist и код TOTP.</p>
<input id="totp" placeholder="Код TOTP" inputmode="numeric" maxlength="6"><button onclick="login()">Войти</button><div id="msg"></div></section>

<nav id="tabs" hidden style="display:flex;gap:8px;margin:0 0 20px">
<button class="secondary compact" onclick="showTab('queue')">Заявки</button>
<button class="secondary compact" onclick="showTab('photos')">Фотографии</button>
<button class="secondary compact" onclick="showTab('complaints')">Жалобы</button>
<button class="secondary compact" onclick="showTab('system')">Система</button>
</nav>

<section id="tab-queue" hidden><div class="stats" id="stats"></div><div id="queue"></div></section>
<section id="tab-photos" hidden><div id="photoQueue"></div></section>
<section id="tab-complaints" hidden><div id="complaintQueue"></div></section>
<section id="tab-system" hidden class="card"><h2>Системное состояние</h2><div id="sysHealth"></div></section>

</main><script>
let token='',role='';
const auth=()=>({Authorization:'Bearer '+token});
// Profile text and complaint reasons are member-supplied and rendered via
// innerHTML below - escape before interpolating. This matters even more
// here than on the member side: unescaped member input reaching this page
// unsanitized would be stored XSS running inside a signed-in moderator's
// session (token, staff API access) rather than just another member's.
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function login(){
  const init=window.Telegram?.WebApp?.initData||'';
  if(!init){msg.innerHTML='<div class="error">Откройте эту страницу как Telegram Mini App (команда /staff у бота).</div>';return}
  const fd=new FormData();fd.append('init_data',init);fd.append('totp_code',totp.value.trim());
  const r=await fetch('/api/v8/staff/auth/telegram',{method:'POST',body:fd});
  const j=await r.json();
  if(!r.ok){msg.innerHTML='<div class="error">'+(j.detail||'Нет доступа')+'</div>';return}
  token=j.access_token;role=j.role;rolePill.textContent=role;
  gate.hidden=true;tabs.hidden=false;showTab('queue');
}
function showTab(name){['queue','photos','complaints','system'].forEach(t=>document.getElementById('tab-'+t).hidden=t!==name);
  if(name==='queue')loadQueue();if(name==='photos')loadPhotos();if(name==='complaints')loadComplaints();if(name==='system')loadHealth()}

async function loadQueue(){
  const s=await(await fetch('/api/v7/staff/dashboard',{headers:auth()})).json();
  stats.innerHTML=Object.entries(s).map(x=>'<div><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');
  const a=await(await fetch('/api/v7/staff/pending',{headers:auth()})).json();
  queue.innerHTML=a.length?a.map(x=>`<article class="candidate"><div><span class="pill">${esc(x.status)}</span><h3>${esc(x.profile?.alias)||'Без анкеты'} · ${x.profile?.age??'—'}</h3><p>${esc(x.profile?.city)} · ${esc(x.profile?.profile_type)}</p><p class="muted">${esc(x.profile?.about)}</p><small>Risk indicator: ${x.risk_score} · verification: ${esc(x.verification?.status)||'нет'} ${x.verification?.submitted?`· <a href="#" onclick="viewVerification(${x.verification.id});return false">материал</a>`:''}</small></div><div class="actions"><button onclick="act(${x.id},'approve')">Одобрить</button><button class="secondary" onclick="act(${x.id},'revise')">Повторная верификация</button><button class="secondary" onclick="act(${x.id},'reject')">Отклонить</button><button class="secondary" onclick="act(${x.id},'suspend')">Приостановить</button>${role==='ADMIN'?`<button class="danger" onclick="act(${x.id},'ban')">BAN</button>`:''}</div></article>`).join(''):'<p class="muted">Очередь пуста.</p>'}
async function act(id,a){const fd=new FormData();fd.append('reason',prompt('Комментарий/причина (можно пусто)')||'');const r=await fetch('/api/v7/staff/users/'+id+'/'+a,{method:'POST',headers:auth(),body:fd});if(!r.ok){const j=await r.json();alert(j.detail||'Ошибка')}loadQueue()}
async function viewVerification(vid){const r=await fetch('/api/v7/staff/verification/'+vid+'/media',{headers:auth()});const j=await r.json();if(r.ok)window.open(j.url,'_blank');else alert(j.detail||'Материал недоступен')}

async function loadPhotos(){
  const a=await(await fetch('/api/v7/staff/photos/pending',{headers:auth()})).json();
  photoQueue.innerHTML=a.length?a.map(p=>`<article class="candidate"><div>${p.url?`<img src="${p.url}" style="max-width:220px;border-radius:10px">`:'<span class="muted">нет превью</span>'}<p class="muted">user #${p.user_id}</p></div><div class="actions"><button onclick="photoDecision(${p.id},'approve')">Одобрить</button><button class="danger" onclick="photoDecision(${p.id},'reject')">Отклонить</button></div></article>`).join(''):'<p class="muted">Нет фото на модерации.</p>'}
async function photoDecision(id,d){await fetch('/api/v7/staff/photos/'+id+'/'+d,{method:'POST',headers:auth()});loadPhotos()}

async function loadComplaints(){
  const a=await(await fetch('/api/v7/staff/complaints',{headers:auth()})).json();
  complaintQueue.innerHTML=a.length?a.map(c=>`<article class="candidate"><div><span class="pill">${esc(c.status)}</span><p>От #${c.from} на #${c.to}</p><p class="muted">${esc(c.reason)}</p><small>${esc(c.created_at)}</small></div><div class="actions">${c.status==='OPEN'?`<button onclick="closeComplaint(${c.id})">Закрыть</button>`:''}</div></article>`).join(''):'<p class="muted">Жалоб нет.</p>'}
async function closeComplaint(id){await fetch('/api/v7/staff/complaints/'+id+'/close',{method:'POST',headers:auth()});loadComplaints()}

async function loadHealth(){
  const h=await(await fetch('/health')).json();const rd=await fetch('/ready');const rj=await rd.json().catch(()=>({}));
  sysHealth.innerHTML=`<p>API: ${h.status} (v${h.version})</p><p>Readiness: ${rd.ok?'ready':'not ready'} — ${JSON.stringify(rj.checks||rj)}</p>`}
if(window.Telegram?.WebApp)Telegram.WebApp.ready();
</script></body></html>
