<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Club · Admin</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell">
<header><div class="brand"><span class="mark">A</span><div><b>MODERATION</b><small>Private Club</small></div></div><span class="pill">Admin</span></header>
<section class="card"><h2>Панель модерации</h2><div class="grid"><input id="key" type="password" placeholder="ADMIN_API_KEY"><button onclick="load()">Открыть очередь</button></div><div id="stats" class="stats"></div><div id="queue"></div></section></main>
<script>
const H=()=>({'X-Admin-Key':document.getElementById('key').value});
async function load(){let d=await fetch('/api/admin/dashboard',{headers:H()});if(!d.ok){queue.innerHTML='<div class=error>Нет доступа</div>';return}let s=await d.json();stats.innerHTML=Object.entries(s).map(x=>'<div><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');let q=await fetch('/api/admin/pending',{headers:H()});render(await q.json())}
function render(a){queue.innerHTML=a.length?a.map(x=>`<article class="candidate"><div><span class=pill>${x.status}</span><h3>${x.profile?.alias||'Без анкеты'} · ${x.profile?.age||'—'}</h3><p>${x.profile?.city||''} · ${x.profile?.profile_type||''}</p><p class=muted>${x.profile?.about||''}</p><small>Risk indicator: ${x.risk_score} · verification: ${x.verification?.status||'нет'}</small></div><div class=actions><button onclick="act(${x.id},'approve')">Одобрить</button><button class=secondary onclick="act(${x.id},'revise')">Повторить</button><button class=danger onclick="act(${x.id},'reject')">Отклонить</button></div></article>`).join(''):'<p class=muted>Очередь пуста.</p>'}
async function act(id,a){let fd=new FormData();fd.append('reason',prompt('Комментарий/причина (можно пусто)')||'');await fetch('/api/admin/users/'+id+'/'+a,{method:'POST',headers:H(),body:fd});load()}
</script></body></html>
